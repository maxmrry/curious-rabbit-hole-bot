name: Autonomous Rabbit Hole Agent

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch: 

jobs:
  explore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      # Added break-system-packages to prevent ubuntu-latest pip errors
      run: pip install -r requirements.txt --break-system-packages
        
    - name: Run Agent
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        LISTEN_NOTES_API_KEY: ${{ secrets.LISTEN_NOTES_API_KEY }}
        PODCAST_INDEX_API_KEY: ${{ secrets.PODCAST_INDEX_API_KEY }}
        PODCAST_INDEX_API_SECRET: ${{ secrets.PODCAST_INDEX_API_SECRET }}
        REDIRECT_BASE_URL: ${{ secrets.REDIRECT_BASE_URL }}
        REDIRECT_SECRET: ${{ secrets.REDIRECT_SECRET }}
      run: python agent.py
      
    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Track memory, RSS feed, AND the new AI weight overrides in feedback.json
        git add state/memory.json docs/feed.xml state/feedback.json
        
        if git diff --quiet && git diff --staged --quiet; then
          echo "No changes to commit."
        else
          git commit -m "🤖 Brain updated memory and RSS feed"
          
          # Titanium Push Loop: Handles both server crashes and race conditions
          for i in {1..10}; do
            git pull --rebase origin main && git push && exit 0
            echo "Push failed. GitHub servers might be choking or a race condition occurred. Retrying in 30 seconds (Attempt $i of 10)..."
            sleep 30
          done
          
          echo "Git push failed after 10 attempts. Exiting."
          exit 1
        fi
